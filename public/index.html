<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Agent · Panel</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --panel-2: #18202b; --border: #243040;
    --text: #e6edf3; --muted: #8b98a8; --accent: #25d366; --warn: #f5a524; --danger: #f04f4f;
    --bubble-user: #1d2733; --bubble-bot: #0f3d2a; --bubble-owner: #2b2440;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.danger { border-color: #5a2626; color: #ffb4b4; }
  button.primary { background: #145a35; border-color: #1d7a49; }
  input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; width: 100%; }
  .hidden { display: none !important; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.open { background: var(--accent); } .dot.qr, .dot.connecting, .dot.starting { background: var(--warn); }
  .dot.closed, .dot.logged_out { background: var(--danger); }
  .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 320px 1fr; height: calc(100% - 57px); }
  aside { border-right: 1px solid var(--border); overflow-y: auto; }
  .chat { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .chat:hover, .chat.active { background: var(--panel); }
  .chat .row { display: flex; justify-content: space-between; gap: 8px; }
  .chat .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat .time, .chat .last { color: var(--muted); font-size: 12px; }
  .chat .last { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #3a2a10; color: var(--warn); }
  section#view { display: flex; flex-direction: column; min-width: 0; }
  .center { margin: auto; text-align: center; color: var(--muted); padding: 24px; }
  .qr-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; display: inline-block; }
  .qr-card img { width: 280px; height: 280px; background: #fff; border-radius: 8px; padding: 8px; }
  .conv-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .conv-head .meta { color: var(--muted); font-size: 12px; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: var(--bubble-user); align-self: flex-start; }
  .msg.bot { background: var(--bubble-bot); align-self: flex-end; }
  .msg.owner { background: var(--bubble-owner); align-self: flex-end; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .login { max-width: 360px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
  .err { color: #ffb4b4; font-size: 13px; min-height: 18px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); } .msg { max-width: 90%; } }
</style>
</head>
<body>
  <form id="login" class="login hidden">
    <h1 style="margin:0;font-size:18px">Panel WA Agent</h1>
    <label for="tokenInput" style="color:var(--muted)">Token del panel (PANEL_TOKEN)</label>
    <input id="tokenInput" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="primary" type="submit">Entrar</button>
  </form>

  <div id="app" class="hidden" style="height:100%">
    <header>
      <h1>WA Agent</h1>
      <span class="pill"><span class="dot" id="statusDot"></span><span id="statusText">…</span></span>
      <span class="pill hidden" id="mePill"></span>
      <span class="spacer"></span>
      <button class="danger" id="logoutBtn" title="Cierra la sesión de WhatsApp y genera un QR nuevo">Desvincular número</button>
    </header>
    <main>
      <aside id="chatList"><div class="center">Sin chats todavía</div></aside>
      <section id="view"></section>
    </main>
  </div>

<script>
(() => {
  'use strict';
  const STATUS_LABEL = { starting: 'Iniciando', qr: 'Esperando escaneo del QR', connecting: 'Conectando',
    open: 'Conectado', logged_out: 'Sesión cerrada', closed: 'Desconectado' };
  const ROLE_LABEL = { user: 'Cliente', bot: 'Bot', owner: 'Tú' };
  const $ = (id) => document.getElementById(id);

  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmtTime = (ms) => ms ? new Date(ms).toLocaleString('es-VE', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const isPaused = (c) => c.pausedUntil != null && c.pausedUntil > Date.now();
  const chatTitle = (c) => c.name || (c.phone ? '+' + c.phone : c.jid);

  let token = null;
  try {
    const url = new URL(location.href);
    const fromUrl = url.searchParams.get('token');
    if (fromUrl) { sessionStorage.setItem('panelToken', fromUrl); url.searchParams.delete('token'); history.replaceState(null, '', url); }
    token = sessionStorage.getItem('panelToken');
  } catch { /* storage bloqueado */ }

  let status = null, chats = [], selected = null, events = null;

  async function api(path, method = 'GET', body) {
    const res = await fetch(path, {
      method, headers: { 'x-panel-token': token, ...(body ? { 'content-type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { logoutPanel('Token inválido'); throw new Error('401'); }
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Error');
    return json.data;
  }

  function logoutPanel(msg) {
    try { sessionStorage.removeItem('panelToken'); } catch {}
    token = null; events?.close(); events = null;
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    $('loginErr').textContent = msg || '';
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    token = $('tokenInput').value.trim();
    try { await api('/api/status'); } catch { return; }
    try { sessionStorage.setItem('panelToken', token); } catch {}
    boot();
  });

  function renderStatus() {
    if (!status) return;
    $('statusDot').className = 'dot ' + status.status;
    $('statusText').textContent = STATUS_LABEL[status.status] || status.status;
    $('mePill').classList.toggle('hidden', !status.me);
    $('mePill').textContent = status.me ? '+' + status.me : '';
    $('logoutBtn').disabled = status.status !== 'open';
    if (!selected) renderView();
  }

  function renderChats() {
    const list = $('chatList');
    if (!chats.length) { list.innerHTML = '<div class="center">Sin chats todavía</div>'; return; }
    list.innerHTML = chats.map((c) => `
      <div class="chat ${c.jid === selected ? 'active' : ''}" data-jid="${esc(c.jid)}">
        <div class="row"><span class="name">${esc(chatTitle(c))}</span><span class="time">${esc(fmtTime(c.lastTs))}</span></div>
        <div class="row"><span class="last">${esc(c.lastText || '')}</span>${isPaused(c) ? '<span class="tag">pausado</span>' : ''}</div>
      </div>`).join('');
  }

  $('chatList').addEventListener('click', (e) => {
    const el = e.target.closest('.chat');
    if (!el) return;
    selected = el.dataset.jid;
    renderChats(); loadConversation();
  });

  function renderView() {
    const view = $('view');
    if (selected) return;
    if (status?.status === 'qr' && status.qr) {
      view.innerHTML = `<div class="center"><div class="qr-card">
        <img alt="Código QR de WhatsApp" src="${esc(status.qr)}">
        <p>WhatsApp → <b>Dispositivos vinculados</b> → <b>Vincular un dispositivo</b></p></div></div>`;
    } else if (status?.status === 'open') {
      view.innerHTML = '<div class="center">Selecciona un chat para ver la conversación</div>';
    } else {
      view.innerHTML = `<div class="center">${esc(STATUS_LABEL[status?.status] || 'Cargando…')}</div>`;
    }
  }

  async function loadConversation() {
    if (!selected) return;
    const jid = selected;
    const { chat, messages } = await api('/api/chats/' + encodeURIComponent(jid) + '/messages');
    if (jid !== selected) return;
    const c = chat || { jid };
    const paused = isPaused(c);
    $('view').innerHTML = `
      <div class="conv-head">
        <button id="backBtn" title="Volver">←</button>
        <div><div><b>${esc(chatTitle(c))}</b></div>
          <div class="meta">${esc(c.phone ? '+' + c.phone : c.jid)}${paused
            ? ' · pausado hasta ' + esc(fmtTime(c.pausedUntil)) + (c.pauseReason ? ' · ' + esc(c.pauseReason) : '')
            : ' · bot activo'}</div></div>
        <span class="spacer"></span>
        ${paused ? '<button class="primary" id="resumeBtn">Reactivar bot</button>' : '<button id="pauseBtn">Pausar bot</button>'}
      </div>
      <div class="msgs" id="msgs">${messages.map((m) => `
        <div class="msg ${esc(m.role)}"><div class="who">${esc(ROLE_LABEL[m.role] || m.role)} · ${esc(fmtTime(m.ts))}</div>${esc(m.text)}</div>`).join('')
        || '<div class="center">Sin mensajes</div>'}</div>`;
    const box = $('msgs'); box.scrollTop = box.scrollHeight;
    $('backBtn').onclick = () => { selected = null; renderChats(); renderView(); };
    $('pauseBtn')?.addEventListener('click', async () => { await api('/api/chats/' + encodeURIComponent(jid) + '/pause', 'POST', {}); refreshChats(); });
    $('resumeBtn')?.addEventListener('click', async () => { await api('/api/chats/' + encodeURIComponent(jid) + '/resume', 'POST'); refreshChats(); });
  }

  async function refreshChats() {
    chats = await api('/api/chats'); renderChats(); if (selected) loadConversation();
  }

  $('logoutBtn').addEventListener('click', async () => {
    if (!confirm('¿Desvincular este número de WhatsApp? Tendrás que escanear un QR nuevo.')) return;
    selected = null;
    try { await api('/api/logout', 'POST'); } catch (e) { alert('No se pudo desvincular: ' + e.message); }
  });

  function connectEvents() {
    events?.close();
    events = new EventSource('/api/events?token=' + encodeURIComponent(token));
    events.addEventListener('status', (e) => { status = JSON.parse(e.data); renderStatus(); });
    events.addEventListener('chats', (e) => { chats = JSON.parse(e.data); renderChats(); if (selected) loadConversation(); });
    events.onerror = () => { $('statusText').textContent = 'Panel desconectado, reintentando…'; };
  }

  async function boot() {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    try { status = await api('/api/status'); } catch { return; }
    renderStatus(); await refreshChats(); connectEvents();
  }

  if (token) boot(); else logoutPanel();
})();
</script>
</body>
</html>
